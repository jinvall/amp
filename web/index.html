<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AMP — Live Audio Visualizer</title>
<style>
  /* SRP theme tokens (mirrors srp-css-theme-pack) */
  :root {
    --color-bg: #0f0a18;
    --color-surface: #1a1230;
    --color-text: #f3f3f7;
    --color-text-muted: #c8c9d4;
    --color-primary: #12f012;
    --color-primary-contrast: #041105;
    --color-secondary: #7a2fff;
    --color-accent: #00d1ff;
    --color-border: #3d2d61;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-surface);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .5px; }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--color-text-muted);
    box-shadow: 0 0 8px currentColor;
  }
  .status-dot.live { background: var(--color-primary); color: var(--color-primary); }
  .spacer { flex: 1; }
  .meter {
    display: flex; align-items: center; gap: 8px;
    font-variant-numeric: tabular-nums; font-size: 13px;
    color: var(--color-text-muted);
  }
  .meter b { color: var(--color-text); }
  .latency-val { min-width: 72px; text-align: right; }
  .latency-val.ok { color: var(--color-primary); }
  .latency-val.warn { color: #ffd23f; }
  .latency-val.over { color: #ff4d4d; }
  main { padding: 14px 18px; display: flex; flex-direction: column; gap: 14px; }
  .panel {
    position: relative;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 10px;
    overflow: hidden;
  }
  .panel .label {
    padding: 8px 12px; font-size: 12px; color: var(--color-text-muted);
    border-bottom: 1px solid var(--color-border);
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .meter-strip {
    position: absolute; top: 0; bottom: 0; width: 48px;
    pointer-events: none; z-index: 2;
  }
  .meter-strip.left { left: 0; }
  .meter-strip.right { right: 0; }
  canvas { display: block; width: 100%; }
  #waveform { height: 220px; padding-right: 52px; }
  #spectrogram { height: 320px; padding-left: 52px; }
  .hint { font-size: 11px; color: var(--color-text-muted); }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .buffer-control { display: inline-flex; align-items: center; gap: 6px; }
  .buffer-control input[type=range] { width: 90px; }
  .buffer-control .val { min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
  select, button {
    background: var(--color-bg); color: var(--color-text);
    border: 1px solid var(--color-border); border-radius: 6px;
    padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  button:hover { border-color: var(--color-accent); }
  input[type=text] {
    background: var(--color-bg); color: var(--color-text);
    border: 1px solid var(--color-border); border-radius: 6px;
    padding: 5px 10px; font-size: 12px; width: 180px;
  }
</style>
</head>
<body>
<header>
  <span id="statusDot" class="status-dot"></span>
  <h1>AMP · Live Audio Visualizer</h1>
  <div class="toolbar">
    <input id="wsUrl" type="text" value="" placeholder="ws://host:8092" />
    <button id="connectBtn">Connect</button>
  </div>
  <div class="spacer"></div>
  <div class="meter">
    <span>FPS</span><b id="fpsVal">0</b>
    <span>RMS</span><b id="rmsVal">0.000</b>
    <span style="margin-left:14px">Latency</span>
    <span id="latVal" class="latency-val ok">— ms</span>
    <span id="budgetVal" class="hint"></span>
  </div>
</header>

<main>
  <div class="panel">
    <div class="label">
      <span>Waveform</span>
      <span class="hint">scrolling · click to freeze</span>
      <label class="hint buffer-control">ring
        <input id="waveBuffer" type="range" min="60" max="1200" step="10" value="600" />
        <span class="val" id="waveBufferVal">600</span>
      </label>
    </div>
    <canvas id="waveform"></canvas>
    <canvas id="waveMeter" class="meter-strip right"></canvas>
  </div>
  <div class="panel">
    <div class="label">
      <span>Spectrogram</span>
      <span class="toolbar">
        <span class="hint">scrolling · low→high freq ↓</span>
        <label class="hint">colormap
          <select id="colormap">
            <option value="inferno">inferno</option>
            <option value="viridis">viridis</option>
            <option value="mono">mono (green)</option>
          </select>
        </label>
        <label class="hint">filter
          <select id="specPreset">
            <option value="logarythmic">logarythmic</option>
            <option value="linear">linear</option>
            <option value="mel">mel</option>
            <option value="hann">hann</option>
            <option value="haris">haris</option>
            <option value="black">black</option>
            <option value="kalman">kalman</option>
          </select>
        </label>
        <label class="hint buffer-control">ring
          <input id="specBuffer" type="range" min="40" max="800" step="10" value="400" />
          <span class="val" id="specBufferVal">400</span>
        </label>
      </span>
    </div>
    <canvas id="spectrogram"></canvas>
    <canvas id="freqMeter" class="meter-strip left"></canvas>
  </div>
</main>

<script>
"use strict";
(function () {
  // ── Config (filled by server "config" hello, defaults otherwise) ──
  const cfg = {
    sampleRate: 44100,
    frameSec: 0.020,
    waveformPoints: 256,
    spectrogramBins: 256,
    budgetMs: 300.0,
  };

  // ── DOM ──
  const waveCanvas = document.getElementById('waveform');
  const specCanvas = document.getElementById('spectrogram');
  const waveMeter = document.getElementById('waveMeter');
  const freqMeter = document.getElementById('freqMeter');
  const wctx = waveCanvas.getContext('2d');
  const sctx = specCanvas.getContext('2d');
  const wmctx = waveMeter.getContext('2d');
  const fmctx = freqMeter.getContext('2d');
  const statusDot = document.getElementById('statusDot');
  const rmsVal = document.getElementById('rmsVal');
  const latVal = document.getElementById('latVal');
  const budgetVal = document.getElementById('budgetVal');
  const connectBtn = document.getElementById('connectBtn');
  const wsUrlInput = document.getElementById('wsUrl');
  const colormapSel = document.getElementById('colormap');

  budgetVal.textContent = 'budget ' + cfg.budgetMs.toFixed(0) + 'ms';

  // ── Ring buffers ──
  const WAVE_HISTORY_DEFAULT = 600;
  const SPEC_HISTORY_DEFAULT = 400;

  function createRingBuffer(capacity) {
    const buf = new Array(capacity);
    for (let i = 0; i < capacity; i++) buf[i] = null;
    return { cap: capacity, n: 0, head: 0, data: buf };
  }
  function ringPush(rb, item) {
    if (rb.n < rb.cap) {
      rb.data[(rb.head + rb.n) % rb.cap] = item;
      rb.n += 1;
    } else {
      rb.data[rb.head] = item;
      rb.head = (rb.head + 1) % rb.cap;
    }
  }
  function ringItem(rb, idx) {
    if (idx >= rb.n) return null;
    const i = (rb.head + idx) % rb.cap;
    return rb.data[i];
  }
  function ringLen(rb) { return rb.n; }

  let waveRb = createRingBuffer(WAVE_HISTORY_DEFAULT);
  let specRb = createRingBuffer(SPEC_HISTORY_DEFAULT);
  let latestRms = 0;
  let frozen = false;

  waveCanvas.addEventListener('click', () => { frozen = !frozen; });

  // Buffer size controls
  const waveBufferInput = document.getElementById('waveBuffer');
  const waveBufferVal = document.getElementById('waveBufferVal');
  const specBufferInput = document.getElementById('specBuffer');
  const specBufferVal = document.getElementById('specBufferVal');

  function setWaveBufferSize(n) {
    n = Math.max(10, Math.min(1200, n));
    const newRb = createRingBuffer(n);
    const old = waveRb;
    const copyCount = Math.min(ringLen(old), n);
    for (let i = 0; i < copyCount; i++) {
      newRb.data[i] = ringItem(old, i);
    }
    newRb.n = copyCount;
    newRb.head = 0;
    waveRb = newRb;
    if (waveBufferInput) waveBufferInput.value = n;
    if (waveBufferVal) waveBufferVal.textContent = String(n);
  }
  function setSpecBufferSize(n) {
    n = Math.max(10, Math.min(800, n));
    const newRb = createRingBuffer(n);
    const old = specRb;
    const copyCount = Math.min(ringLen(old), n);
    for (let i = 0; i < copyCount; i++) {
      newRb.data[i] = ringItem(old, i);
    }
    newRb.n = copyCount;
    newRb.head = 0;
    specRb = newRb;
    if (specBufferInput) specBufferInput.value = n;
    if (specBufferVal) specBufferVal.textContent = String(n);
  }
  if (waveBufferInput) {
    waveBufferInput.value = String(WAVE_HISTORY_DEFAULT);
    if (waveBufferVal) waveBufferVal.textContent = String(WAVE_HISTORY_DEFAULT);
    waveBufferInput.addEventListener('input', () => setWaveBufferSize(parseInt(waveBufferInput.value, 10) || WAVE_HISTORY_DEFAULT));
  }
  if (specBufferInput) {
    specBufferInput.value = String(SPEC_HISTORY_DEFAULT);
    if (specBufferVal) specBufferVal.textContent = String(SPEC_HISTORY_DEFAULT);
    specBufferInput.addEventListener('input', () => setSpecBufferSize(parseInt(specBufferInput.value, 10) || SPEC_HISTORY_DEFAULT));
  }

  // ── HiDPI canvas sizing ──
  function fitCanvas(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w: rect.width, h: rect.height };
  }
  let waveSize = fitCanvas(waveCanvas);
  let specSize = fitCanvas(specCanvas);
  let waveMeterSize = fitCanvas(waveMeter);
  let freqMeterSize = fitCanvas(freqMeter);
  window.addEventListener('resize', () => {
    waveSize = fitCanvas(waveCanvas);
    specSize = fitCanvas(specCanvas);
    waveMeterSize = fitCanvas(waveMeter);
    freqMeterSize = fitCanvas(freqMeter);
  });

  // ── Colormaps (precomputed 256-entry lookup) ──
  function buildColormap(name) {
    const lut = new Array(256);
    for (let i = 0; i < 256; i++) {
      const t = i / 255;
      let r, g, b;
      if (name === 'mono') {
        r = 18 * t; g = 240 * t; b = 18 * t;
      } else if (name === 'viridis') {
        // cheap viridis approximation
        r = Math.round(255 * (0.27 + 0.90 * t - 0.5 * t * t));
        g = Math.round(255 * (0.00 + 0.85 * t));
        b = Math.round(255 * (0.33 + 0.51 * t - 0.25 * t * t));
      } else { // inferno-ish
        r = Math.round(255 * Math.min(1, 0.0 + 1.4 * t));
        g = Math.round(255 * Math.min(1, Math.max(0, -0.3 + 1.3 * t - 0.4 * t * t)));
        b = Math.round(255 * Math.min(1, Math.max(0, 0.4 + 0.9 * t - 1.1 * t * t)));
      }
      lut[i] = 'rgb(' + (r > 255 ? 255 : r) + ',' + (g > 255 ? 255 : g) + ',' + (b > 255 ? 255 : b) + ')';
    }
    return lut;
  }
  let colormap = buildColormap(colormapSel.value);
  colormapSel.addEventListener('change', () => { colormap = buildColormap(colormapSel.value); });
  const specPreset = document.getElementById('specPreset');
  if (specPreset) {
    specPreset.addEventListener('change', () => {
      const preset = specPreset.value;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({type: 'preset', preset}));
      }
    });
  }

  // ── WebSocket (auto-reconnect with backoff; never blocks the audio path) ──
  let ws = null;
  let wsRetry = 0;
  let wsRetryTimer = null;
  let lastServerTs = 0;     // seconds (epoch) of most recent frame
  let lastPaintTs = 0;      // performance.now() when we received it
  let estLatencyMs = 0;
  let frameCount = 0;
  let lastFpsTime = performance.now();
  let currentFps = 0;
  const fpsVal = document.getElementById('fpsVal');

  function setStatus(state, label) {
    statusDot.classList.remove('live');
    if (state === 'live') statusDot.classList.add('live');
    statusDot.title = label || state;
  }

  function connect(url) {
    if (wsRetryTimer) { clearTimeout(wsRetryTimer); wsRetryTimer = null; }
    if (ws) { try { ws.close(); } catch (e) {} }
    setStatus('connecting', 'connecting…');
    ws = new WebSocket(url);
    ws.onopen = () => { wsRetry = 0; setStatus('live', 'connected'); };
    ws.onclose = () => {
      setStatus('down', 'disconnected — retrying');
      // Backoff: 0.5s, 1s, 2s, 4s … capped at 8s.
      wsRetry = Math.min(wsRetry + 1, 6);
      const delay = Math.min(500 * Math.pow(2, wsRetry - 1), 8000);
      wsRetryTimer = setTimeout(() => connect(url), delay);
    };
    ws.onerror = () => { /* onclose will handle reconnect */ };
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'config') {
        Object.assign(cfg, msg);
        budgetVal.textContent = 'budget ' + cfg.budgetMs.toFixed(0) + 'ms';
        return;
      }
      // analysis frame
      const wave = new Float32Array(msg.wave);
      const spec = new Float32Array(msg.spec);
      if (!frozen) {
        ringPush(waveRb, wave);
        ringPush(specRb, spec);
      }
      latestRms = msg.rms || 0;
      lastServerTs = msg.t;
      lastPaintTs = performance.now();
      // latency is measured at paint time relative to server timestamp
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        currentFps = Math.round(frameCount / ((now - lastFpsTime) / 1000));
        frameCount = 0;
        lastFpsTime = now;
      }
      // Log inter-frame arrival interval for debugging.
      if (window.__lastFrameArrival) {
        const dt = now - window.__lastFrameArrival;
        if (dt > 150) {
          console.warn('[viz] frame gap', dt.toFixed(0), 'ms @', new Date().toISOString());
        }
      }
      window.__lastFrameArrival = now;
    };
  }

  connectBtn.addEventListener('click', () => {
    const url = wsUrlInput.value.trim();
    if (url) connect(url);
  });

  // ── Drawing ──
  let lastDrawnWaveLen = 0;
  let lastDrawnSpecLen = 0;

  function drawWaveform() {
    const { w, h } = waveSize;
    const n = cfg.waveformPoints;
    const cap = waveRb.cap;
    const colW = w / cap;
    const historyLen = ringLen(waveRb);
    const oldestIdx = Math.max(0, historyLen - cap);
    const visibleCount = historyLen - oldestIdx;

    wctx.fillStyle = '#0f0a18';
    wctx.fillRect(0, 0, w, h);
    wctx.strokeStyle = 'rgba(61,45,97,0.6)';
    wctx.lineWidth = 1;
    wctx.beginPath(); wctx.moveTo(0, h / 2); wctx.lineTo(w, h / 2); wctx.stroke();

    if (visibleCount === 0) {
      lastDrawnWaveLen = 0;
      drawWaveMeter(h);
      return;
    }

    const oldestVisibleIdx = oldestIdx;
    for (let f = oldestVisibleIdx; f < historyLen; f++) {
      const buf = ringItem(waveRb, f);
      if (!buf) continue;
      const framePos = f - oldestVisibleIdx;
      const x = framePos * colW;
      wctx.strokeStyle = 'rgba(0,209,255,0.85)';
      wctx.beginPath();
      for (let i = 0; i < n; i++) {
        const px = x + (i / n) * colW;
        const py = h / 2 - buf[i] * (h / 2 - 4);
        if (i === 0) wctx.moveTo(px, py); else wctx.lineTo(px, py);
      }
      wctx.stroke();
    }
    lastDrawnWaveLen = visibleCount;
    drawWaveMeter(h);
  }

  function drawWaveMeter(h) {
    const { w } = waveMeterSize;
    const mw = Math.max(1, w);
    wmctx.clearRect(0, 0, mw, h);
    wmctx.fillStyle = '#0f0a18';
    wmctx.fillRect(0, 0, mw, h);
    const rms = latestRms || 0;
    const db = rms > 0 ? 20 * Math.log10(rms) : -60;
    const pct = Math.max(0, Math.min(1, (db + 60) / 60));
    const barH = h * pct;
    const grad = wmctx.createLinearGradient(0, h, 0, 0);
    grad.addColorStop(0, '#12f012');
    grad.addColorStop(0.6, '#ffd23f');
    grad.addColorStop(1, '#ff4d4d');
    wmctx.fillStyle = grad;
    wmctx.fillRect(4, h - barH, mw - 8, barH);
    wmctx.strokeStyle = '#3d2d61';
    wmctx.strokeRect(4, 0, mw - 8, h);
    wmctx.fillStyle = '#f3f3f7';
    wmctx.font = '10px -apple-system, sans-serif';
    wmctx.textAlign = 'center';
    wmctx.textBaseline = 'middle';
    wmctx.fillText(db.toFixed(0) + ' dB', mw / 2, h / 2);
  }

  function drawSpectrogram() {
    const { w, h } = specSize;
    const n = cfg.spectrogramBins;
    const cap = specRb.cap;
    const colW = w / cap;
    const historyLen = ringLen(specRb);
    const oldestIdx = Math.max(0, historyLen - cap);
    const visibleCount = historyLen - oldestIdx;

    sctx.clearRect(0, 0, w, h);
    sctx.fillStyle = '#0f0a18';
    sctx.fillRect(0, 0, w, h);

    if (visibleCount === 0) {
      lastDrawnSpecLen = 0;
      drawFreqMeter(h, n);
      return;
    }

    const oldestVisibleIdx = oldestIdx;
    for (let f = oldestVisibleIdx; f < historyLen; f++) {
      const buf = ringItem(specRb, f);
      if (!buf) continue;
      const framePos = f - oldestVisibleIdx;
      const x = framePos * colW;
      for (let i = 0; i < n; i++) {
        const v = buf[i];
        const idx = Math.max(0, Math.min(255, Math.round(v * 255)));
        sctx.fillStyle = colormap[idx];
        const y = (1 - i / n) * h;
        sctx.fillRect(x, y, colW + 1, h / n + 1);
      }
    }
    lastDrawnSpecLen = visibleCount;
    drawFreqMeter(h, n);
  }

  function drawFreqMeter(h, n) {
    const { w, h: mh } = freqMeterSize;
    fmctx.clearRect(0, 0, w, mh);
    fmctx.fillStyle = '#0f0a18';
    fmctx.fillRect(0, 0, w, mh);
    fmctx.font = '10px -apple-system, sans-serif';
    fmctx.fillStyle = '#c8c9d4';
    fmctx.textAlign = 'right';
    fmctx.textBaseline = 'middle';
    const sr = cfg.sampleRate || 44100;
    const nyquist = sr / 2;
    const steps = 6;
    for (let i = 0; i <= steps; i++) {
      const frac = i / steps;
      const freq = frac * nyquist;
      const y = (1 - frac) * mh;
      fmctx.fillText(freq >= 1000 ? (freq/1000).toFixed(1) + 'k' : Math.round(freq) + '', w - 4, y);
      fmctx.strokeStyle = 'rgba(61,45,97,0.5)';
      fmctx.beginPath(); fmctx.moveTo(0, y); fmctx.lineTo(w, y); fmctx.stroke();
    }
  }

  function updateMeters() {
    if (fpsVal) fpsVal.textContent = currentFps;
    rmsVal.textContent = latestRms.toFixed(3);
    // Latency = time since the most recent frame's server timestamp, measured now.
    if (lastServerTs > 0) {
      const nowSec = Date.now() / 1000;
      // Combine transport age (server->now) — server ts is in epoch seconds.
      estLatencyMs = Math.max(0, (nowSec - lastServerTs) * 1000);
    }
    latVal.textContent = estLatencyMs.toFixed(0) + ' ms';
    if (estLatencyMs <= cfg.budgetMs * 0.7) latVal.className = 'latency-val ok';
    else if (estLatencyMs <= cfg.budgetMs) latVal.className = 'latency-val warn';
    else latVal.className = 'latency-val over';
  }

  function loop() {
    drawWaveform();
    drawSpectrogram();
    updateMeters();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Auto-connect using current host + default viz port if no URL provided.
  if (!wsUrlInput.value) {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    wsUrlInput.value = proto + '://' + location.hostname + ':8092';
  }
})();
</script>
</body>
</html>
